<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>智库 - AI 知识外脑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5364dc',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<link rel="stylesheet" href="refresh.css">
</head>
<body class="bg-gray-50 flex justify-center min-h-screen text-gray-800 font-sans">
    <div class="rev-shell w-full bg-white flex flex-col h-screen relative shadow-2xl overflow-hidden">
        <header class="flex justify-between items-center px-5">
            <div class="flex items-center gap-3"><div class="rev-logo" style="width:38px;height:38px;border-radius:13px"><i class="fas fa-brain"></i></div>
              <div><h1 class="text-lg font-extrabold" style="color:#17263d">智库 AI <span style="color:#5364dc">·</span> 学习空间</h1><p class="text-xs" style="color:#8190a4">Learn a little, every day.</p></div></div>
            <button aria-label="个人中心" class="rev-logo" style="width:37px;height:37px;font-size:15px;border:none;cursor:pointer" onclick="navigateTo('center.html')"><i class="fas fa-user"></i></button>
        </header>
        <main class="flex-1 overflow-y-auto no-scrollbar">
            <div id="rev-dashboard" class="rev-home" aria-live="polite"></div>
        </main>
        <!-- Bottom Tab Bar -->
        <nav class="absolute bottom-0 w-full h-20 bg-white/90 backdrop-blur-md flex border-t border-gray-100 shadow-[0_-4px_20px_rgba(0,0,0,0.03)] z-30 pb-2">
            <div class="flex-1 flex flex-col items-center justify-center text-primary cursor-pointer group" onclick="navigateTo('index.html')">
                <div class="w-12 h-8 flex items-center justify-center rounded-2xl mb-1 group-active:bg-blue-50 transition">
                    <i class="fas fa-home text-xl"></i>
                </div>
                <span class="text-[10px] font-medium">首页</span>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center text-gray-400 cursor-pointer group hover:text-gray-600" onclick="navigateTo('knowledge.html')">
                <div class="w-12 h-8 flex items-center justify-center rounded-2xl mb-1 group-active:bg-gray-50 transition">
                    <i class="fas fa-project-diagram text-xl"></i>
                </div>
                <span class="text-[10px] font-medium">知识</span>
            </div>
            
            <!-- Floating FAB -->
            <div class="relative -top-6">
                <div class="w-14 h-14 bg-gradient-to-br from-primary to-blue-600 rounded-full shadow-lg shadow-blue-500/40 flex items-center justify-center text-white text-2xl cursor-pointer transform hover:scale-105 active:scale-95 transition border-4 border-white" onclick="startRandomQuiz()">
                    <i class="fas fa-play ml-1"></i>
                </div>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center text-gray-400 cursor-pointer group hover:text-gray-600" onclick="navigateTo('note.html')">
                <div class="w-12 h-8 flex items-center justify-center rounded-2xl mb-1 group-active:bg-gray-50 transition">
                    <i class="fas fa-book text-xl"></i>
                </div>
                <span class="text-[10px] font-medium">笔记</span>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center text-gray-400 cursor-pointer group hover:text-gray-600" onclick="navigateTo('center.html')">
                <div class="w-12 h-8 flex items-center justify-center rounded-2xl mb-1 group-active:bg-gray-50 transition">
                    <i class="fas fa-user text-xl"></i>
                </div>
                <span class="text-[10px] font-medium">我的</span>
            </div>
        </nav>

        <!-- Modal for Knowledge Tree (Hidden by default) -->
        <div id="tree-modal" class="hidden fixed inset-0 bg-black/50 z-50 items-end justify-center">
            <div class="w-full h-[80%] bg-white rounded-t-2xl flex flex-col animate-slide-up transform transition-transform duration-300 translate-y-full">
                <div class="p-4 border-b border-gray-100 flex justify-between items-center shrink-0">
                    <h3 class="text-base font-bold text-gray-800">选择知识点</h3>
                    <span class="text-2xl text-gray-400 cursor-pointer hover:text-gray-600" onclick="closeModal('tree-modal')">&times;</span>
                </div>
                <div class="flex-1 overflow-y-auto p-4">
                    <div class="tree-level" id="tree-root">
                        <!-- Dynamic Tree Content -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="refresh.js"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</body>
</html>
